<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./css/output.css" rel="stylesheet">
    <script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/cdn@10.4.0/video-scaffold.js"></script>
     <script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/cdn@10.4.0/media/hlsjs-video.js"></script>
    <title>SmartStream</title>
</head>
<body>
    <main class="flex flex-row w-full h-screen relative">
    <section class="flex flex-col bg-black w-[50%] h-screen">
        
        <div class="flex flex-row">
            <button class="w-[10%] h-[70%]" id="open-popout"><img src="imgs/triangle_blanc_fond_violet.png" alt="button" class="w-full h-full"></button>
            
            <h1 class=" text-white text-4xl shadow-purple-600">SmartStream</h1>
            
            <input type="search" class="w-[95%] text-white border border-purple-600 rounded bg-gray-950 mt-4 mr-3 p-2 h-[15%]" id="search">

        </div>
       
        <ul class="flex flex-col bg-gray-950 mt-9 w-full border border-blue-800 h-[85%] overflow-y-auto" id="channel">
                
        </ul>
            

       

    </section>
    <div id="popout-page" class="hidden fixed inset-0 z-50 bg-black/50">
       <section class="bg-purple-600 w-[30%] h-screen">
          <button type="button" id="close-popout" class="border border-blue-800 ml-[100%] bg-blue-50">X</button>
          <h1 class="text-4xl text-white ml-36">Categories</h1>
          <div class="flex flex-col items-center bg-black w-full h-[80%] mt-3 overflow-auto" id="categories">
            <button type="button" class="category-btn w-[90%] h-[10%] bg-purple-600 mt-4 p-3 rounded-2xl text-2xl text-white hover:bg-purple-900" id="ALL">ALL</button>
            <button type="button" class=" category-btn w-[90%] h-[10%] bg-purple-600 mt-4 p-3 rounded-2xl text-2xl text-white hover:bg-purple-900" id="Morocco">Morocco</button>
            <button type="button" class="category-btn w-[90%] h-[10%] bg-purple-600 mt-4 p-3 rounded-2xl text-2xl text-white hover:bg-purple-900" id="France">France</button>
            <button type="button" class="category-btn w-[90%] h-[10%] bg-purple-600 mt-4 p-3 rounded-2xl text-2xl text-white hover:bg-purple-900 " id="Japan">Japan</button>
            <button type="button" class="category-btn w-[90%] h-[10%] bg-purple-600 mt-4 p-3 rounded-2xl text-2xl text-white hover:bg-purple-900" id="China">China</button>
            <button type="button" class="category-btn w-[90%] h-[10%] bg-purple-600 mt-4 p-3 rounded-2xl text-2xl text-white hover:bg-purple-900" id="America">UnitedStats</button>
            <button type="button" class="category-btn w-[90%] h-[10%] bg-purple-600 mt-4 p-3 rounded-2xl text-2xl text-white hover:bg-purple-900" id="UK">UnitedKingdom</button>
            <button type="button" class="category-btn w-[90%] h-[10%] bg-purple-600 mt-4 p-3 rounded-2xl text-2xl text-white hover:bg-purple-900" id="Spain">Spain</button>
            <button type="button" class="category-btn w-[90%] h-[10%] bg-purple-600 mt-4 p-3 rounded-2xl text-2xl text-white hover:bg-purple-900" id="Italy">Italy</button>
            <button type="button" class="category-btn w-[90%] h-[10%] bg-purple-600 mt-4 p-3 rounded-2xl text-2xl text-white hover:bg-purple-900" id="Russia">Russia</button>
            <button type="button" class="category-btn w-[90%] h-[10%] bg-purple-600 mt-4 p-3 rounded-2xl text-2xl text-white hover:bg-purple-900" id="Korea">Korea</button>
         
              
          </div>
       </section>
   </div>
    
   <section class="w-screen">
       <div class="flex flex-row bg-black h-1/2 w-full justify-center" id="imgpreview">
    

       </div>
      <div class="flex flex-row bg-purple-600 w-full h-1/2 items-center justify-between" id="info">
        

      </div>

    </section>
    
   
    </main>
    
    <script type="module" src="./js/ui.js"></script>
</body>
</html>
