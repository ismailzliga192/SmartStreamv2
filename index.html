<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./css/output.css" rel="stylesheet">
    <link href="./css/style.css" rel="stylesheet">
    <script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/cdn@10.4.0/video-scaffold.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/cdn@10.4.0/media/hlsjs-video.js"></script>
    <title>SmartStream</title>
</head>

<body>
    <main class="flex flex-row w-full h-screen relative">
        <section class="flex flex-col bg-black w-[50%] h-screen">

            <div class="flex flex-row">
                <button class="w-[10%] h-[70%]" id="open-popout"><img src="imgs/triangle_blanc_fond_violet.png"
                        alt="button" class="w-full h-full"></button>

                <h1 class=" text-white text-4xl shadow-purple-600">SmartStream</h1>

                <input type="search"
                    class="w-[95%] text-white border border-purple-600 rounded bg-gray-950 mt-4 mr-3 p-2 h-[15%]"
                    id="search">

            </div>
            <p id="message" class="text-white text-center mt-2"></p>

            <ul class="flex flex-col bg-gray-950 mt-9 w-full border border-blue-800 h-[85%] overflow-y-auto"
                id="channel">

            </ul>




        </section>
        <div id="popout-page" class="hidden fixed inset-0 z-50 bg-black">
            <section class="bg-purple-600 w-[30%] h-screen">
                <button type="button" id="close-popout" class="border border-white ml-[100%] bg-blue-50">X</button>
                <h1 class="text-4xl text-white ml-36">Categories</h1>
                <div class="flex flex-row w-full justify-between">
                    <button id="favo"
                        class="mt-4 border border-white text-center rounded-2xl bg-black text-white w-1/2">Favorites</button>
                    <button id="ban"
                        class="mt-4 border border-white text-center rounded-2xl bg-black text-white w-1/2">Blacklist</button>
                </div>
                <div class="w-full ml-25">
                    <button id="popout-p" class="mt-2 border border-white bg-black text-center rounded-2xl text-white w-1/2">AddChannel</button>
                </div>
                <div class="flex flex-col items-center bg-black w-full h-[80%] mt-3 overflow-auto" id="categories">
                    <button type="button"
                        class="category-btn w-[90%] h-[10%] bg-purple-600 mt-4 p-3 rounded-2xl text-2xl text-white hover:bg-purple-900"
                        id="ALL">ALL</button>
                    <button type="button"
                        class=" category-btn w-[90%] h-[10%] bg-purple-600 mt-4 p-3 rounded-2xl text-2xl text-white hover:bg-purple-900"
                        id="Morocco">Morocco</button>
                    <button type="button"
                        class="category-btn w-[90%] h-[10%] bg-purple-600 mt-4 p-3 rounded-2xl text-2xl text-white hover:bg-purple-900"
                        id="France">France</button>
                    <button type="button"
                        class="category-btn w-[90%] h-[10%] bg-purple-600 mt-4 p-3 rounded-2xl text-2xl text-white hover:bg-purple-900 "
                        id="Japan">Japan</button>
                    <button type="button"
                        class="category-btn w-[90%] h-[10%] bg-purple-600 mt-4 p-3 rounded-2xl text-2xl text-white hover:bg-purple-900"
                        id="China">China</button>
                    <button type="button"
                        class="category-btn w-[90%] h-[10%] bg-purple-600 mt-4 p-3 rounded-2xl text-2xl text-white hover:bg-purple-900"
                        id="America">UnitedStats</button>
                    <button type="button"
                        class="category-btn w-[90%] h-[10%] bg-purple-600 mt-4 p-3 rounded-2xl text-2xl text-white hover:bg-purple-900"
                        id="UK">UnitedKingdom</button>
                    <button type="button"
                        class="category-btn w-[90%] h-[10%] bg-purple-600 mt-4 p-3 rounded-2xl text-2xl text-white hover:bg-purple-900"
                        id="Spain">Spain</button>
                    <button type="button"
                        class="category-btn w-[90%] h-[10%] bg-purple-600 mt-4 p-3 rounded-2xl text-2xl text-white hover:bg-purple-900"
                        id="Italy">Italy</button>
                    <button type="button"
                        class="category-btn w-[90%] h-[10%] bg-purple-600 mt-4 p-3 rounded-2xl text-2xl text-white hover:bg-purple-900"
                        id="Russia">Russia</button>
                    <button type="button"
                        class="category-btn w-[90%] h-[10%] bg-purple-600 mt-4 p-3 rounded-2xl text-2xl text-white hover:bg-purple-900"
                        id="Korea">Korea</button>


                </div>
            </section>
        </div>

        <section class="w-screen">
            <div class="flex flex-row bg-black h-1/2 w-full justify-center" id="imgpreview">
                <div class="flex justify-center items-center" id="imgload"><span class="loader"></span></div>


            </div>
            <div class="flex flex-row bg-purple-600 w-full h-1/2 items-center justify-center " id="info">
                <div class="flex justify-center" id="info_load"><span class="loader1"></span></div>
            </div>

        </section>


    </main>

    <div id="popout-menu" class="hidden absolute left-125 top-45 inset-0 z-50 bg-black items-center justify-center">
        <div class="bg-purple-600 p-6 rounded-2xl w-[90%] max-w-md">
            <div class="flex flex-row justify-between items-center mb-4">
                <h2 class="text-3xl text-white">Ajouter une chaine</h2>
                <button type="button" id="close-add" class="border border-white bg-blue-50 px-2">X</button>
            </div>

            <form id="add-form" class="flex flex-col gap-3">
                <input id="add-name" type="text" placeholder="Nom de la chaîne" required class="p-2 rounded text-white bg-black">
                <input id="add-logo" type="url" placeholder="Lien du logo (https://...)" required
                    class="p-2 rounded text-white bg-black">
                <select id="add-country" required class="p-2 rounded text-white bg-black">
                    <option value="Morocco">Morocco</option>
                    <option value="France">France</option>
                    <option value="Japan">Japan</option>
                    <option value="China">China</option>
                    <option value="America">UnitedStats</option>
                    <option value="UK">UnitedKingdom</option>
                    <option value="Spain">Spain</option>
                    <option value="Italy">Italy</option>
                    <option value="Russia">Russia</option>
                    <option value="Korea">Korea</option>
                </select>
                <button  class="bg-black text-white p-2 rounded-2xl hover:bg-purple-900" id="submit1">Ajouter</button>
            </form>
        </div>
    </div>


    <script type="module" src="./js/app.js"></script>
</body>

</html>
